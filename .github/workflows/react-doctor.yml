# React Doctor — React codebase health (security, performance, correctness,
# accessibility, bundle-size, architecture). Runs in CI like the perf gates.
#
# Telemetry-off (harness rule, matches PERF.md): we run the PINNED local CLI
# with --no-telemetry (skips the score API, the share URL, and Sentry crash
# reporting) instead of the hosted millionco/react-doctor action, which posts a
# health score through their API and needs issues/PR write permissions. So this
# job needs only `contents: read` and sends nothing off-box.
#
# Source: https://github.com/millionco/react-doctor

name: react-doctor

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so --scope changed can diff the base
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Gates on new error-severity findings in changed files. --base scopes a
      # push scan to commits since the previous push (github.event.before)
      # instead of the full repo history; a PR scan diffs the PR's base sha.
      # Relax with --blocking warning (fail on any finding) or --blocking none
      # (advisory).
      - run: >
          pnpm exec react-doctor --no-telemetry --scope changed --blocking error
          --base ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
